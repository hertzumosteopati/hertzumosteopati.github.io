<!-- @dsCard height=300 -->
<style>
  .cover { position: relative; width: 960px; height: 300px; background: var(--kalk); overflow: hidden; }
  .cover svg { position: absolute; inset: 0; width: 960px; height: 300px; }
  .cover .name { position: absolute; left: 48px; bottom: 72px; margin: 0; font-family: var(--font-display); font-size: 76px; line-height: 0.95; font-weight: 500; letter-spacing: -0.03em; font-variation-settings: "opsz" 96; color: var(--tang); max-width: 440px; }
  .cover .tag { position: absolute; left: 48px; bottom: 36px; margin: 0; font-family: var(--font-serif); font-size: 14px; line-height: 1.4; color: var(--tang-muted); max-width: 440px; white-space: nowrap; }
  .tang { fill: var(--tang); }
  .siv { fill: var(--siv); }
  .sand { fill: var(--sand); }
  .rav { fill: var(--rav); }
  .arch { fill: none; stroke: var(--kalk); stroke-width: 8; stroke-linecap: round; }
  .tile-l { rx: var(--radius-l); }
  .tile-m { rx: var(--radius-m); }
</style>
<div class="cover">
  <!--
    blocks: tang 240×252 slab bleeding off the top (radius-l), siv 200×120 and sand 200×124 bleeding off the right (radius-m), rav disc r=16 (space-6/2)
    arrangement: one tall slab with two satellites, flush at x=496, satellites at space-5 (24) from the slab and space-5 apart
    pattern: arcs — the brand's literal motif is the mark's arch (hands over a supported back), so three kalk arches cut into the slab at space-7 (48) pitch, stroke space-2 (8), with the touchpoint disc on the top apex as in the mark
    scales: space-2 8, space-5 24, space-6 32, space-7 48, radius-m 16, radius-l 28
  -->
  <svg viewBox="0 0 960 300" aria-hidden="true">
    <rect class="tang tile-l" x="496" y="-28" width="240" height="280"/>
    <rect class="siv tile-m" x="760" y="32" width="232" height="120"/>
    <rect class="sand tile-m" x="760" y="176" width="232" height="156"/>
    <path class="arch" d="M536 140 Q616 60 696 140"/>
    <path class="arch" d="M536 188 Q616 108 696 188"/>
    <path class="arch" d="M536 236 Q616 156 696 236"/>
    <circle class="rav" cx="616" cy="100" r="16"/>
  </svg>
  <h1 class="name">Hertzum<br>Osteopati</h1>
  <p class="tag">Osteopati for babyer, børn og voksne – i Brøndby og Nykøbing Sj.</p>
</div>
